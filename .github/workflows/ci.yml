name: Verify PixelCutout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify npm manifests
        run: |
          test -s package.json
          test -s package-lock.json
          node -e "const lock = require('./package-lock.json'); if (lock.lockfileVersion !== 3 || !lock.packages?.['']) process.exit(1); console.log('lockfileVersion:', lock.lockfileVersion, 'package entries:', Object.keys(lock.packages).length)"
          node --version
          npm --version
          npm config get package-lock
      - name: Install dependencies
        run: npm ci --package-lock=true --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Report all dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          let report;
          try {
            report = JSON.parse(fs.readFileSync('/tmp/npm-audit-all.json', 'utf8'));
          } catch (error) {
            console.log(`Full dependency audit report unavailable: ${error.message}`);
            process.exit(0);
          }

          console.log('Full dependency audit counts:', JSON.stringify(report.metadata?.vulnerabilities ?? null));
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (finding.via ?? []).map((item) =>
              typeof item === 'string' ? item : `${item.name}: ${item.title ?? item.url ?? ''}`
            );
            console.log(
              `${finding.severity} ${name}@${finding.range}; direct=${finding.isDirect}; fix=${JSON.stringify(finding.fixAvailable)}; via=${via.join(' | ')}`
            );
          }
          NODE
      - name: Build standalone local browser benchmark
        run: npm run benchmark:browser:build
      - name: Install synthetic benchmark test dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Test local benchmark acquisition and synthetic fixture tooling
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: Validate benchmark manifest
        run: npm run benchmark:validate
      - name: Build, type-check and run unit tests
        run: npm run build
