name: Verify PixelCutout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify npm manifests
        run: |
          test -s package.json
          test -s package-lock.json
          node -e "const lock = require('./package-lock.json'); if (lock.lockfileVersion !== 3 || !lock.packages?.['']) process.exit(1); console.log('lockfileVersion:', lock.lockfileVersion, 'root package entries:', Object.keys(lock.packages).length)"
          npm config get package-lock
      - name: Install dependencies
        run: npm ci --package-lock=true --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Build, type-check and run unit tests
        run: npm run build
