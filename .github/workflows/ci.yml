name: Verify PixelCutout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify committed npm manifests
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (lock.lockfileVersion !== 3 || !root) {
            throw new Error('Expected a valid npm lockfile v3 with a root package entry.');
          }
          if (JSON.stringify(root.dependencies) !== JSON.stringify(pkg.dependencies)) {
            throw new Error('package-lock.json runtime dependencies do not match package.json.');
          }
          if (JSON.stringify(root.devDependencies) !== JSON.stringify(pkg.devDependencies)) {
            throw new Error('package-lock.json devDependencies do not match package.json.');
          }
          console.log(`Validated npm lockfile: ${Object.keys(lock.packages).length} package entries, ${fs.statSync('package-lock.json').size} bytes.`);
          NODE
      - name: Install dependencies from committed lockfile
        run: npm ci --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Report dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('npm audit counts:', JSON.stringify(report.metadata?.vulnerabilities ?? null));
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (finding.via ?? []).map((item) =>
              typeof item === 'string' ? item : `${item.name}: ${item.title ?? item.url ?? ''}`
            );
            console.log(
              `${finding.severity} ${name}@${finding.range}; direct=${finding.isDirect}; fix=${JSON.stringify(finding.fixAvailable)}; via=${via.join(' | ')}`
            );
          }
          NODE
      - name: Build, type-check and run unit tests
        run: npm run build
