name: Verify PixelCutout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify npm manifest and regenerate truncated lockfile
        run: |
          test -s package.json
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          console.log('package.json parsed:', pkg.name, pkg.version);
          NODE
          rm -f package-lock.json
          npm install --package-lock-only --package-lock=true --ignore-scripts --no-audit --no-fund --onnxruntime-node-install-cuda=skip
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const count = Object.keys(lock.packages ?? {}).length;
          if (lock.lockfileVersion < 1 || count < 50) {
            throw new Error(`Unexpected lockfile: version=${lock.lockfileVersion}, package entries=${count}`);
          }
          console.log(`Regenerated lockfile: version=${lock.lockfileVersion}, package entries=${count}, bytes=${fs.statSync('package-lock.json').size}`);
          NODE
      - name: Install from regenerated lockfile
        run: npm ci --package-lock=true --no-audit --no-fund --onnxruntime-node-install-cuda=skip
      - name: Report dependency audit
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          for (const [label, path] of [
            ['all dependencies', '/tmp/npm-audit-all.json'],
            ['production dependencies', '/tmp/npm-audit-production.json']
          ]) {
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (error) {
              console.log(`npm audit ${label}: report unavailable (${error.message})`);
              continue;
            }

            console.log(`npm audit ${label} counts:`, JSON.stringify(report.metadata?.vulnerabilities ?? null));
            for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (finding.via ?? []).map((item) =>
                typeof item === 'string' ? item : `${item.name}: ${item.title ?? item.url ?? ''}`
              );
              console.log(
                `${finding.severity} ${name}@${finding.range}; direct=${finding.isDirect}; fix=${JSON.stringify(finding.fixAvailable)}; via=${via.join(' | ')}`
              );
            }
          }
          NODE
      - name: Build, type-check and run unit tests
        run: npm run build
      - name: Export generated lockfile for repository repair
        run: |
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json | fold -w 2000
          echo
          echo LOCKFILE_BASE64_END
