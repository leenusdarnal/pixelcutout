name: Acquire AIM-500 benchmark candidates

on:
  workflow_dispatch:
    inputs:
      confirm_download:
        description: "Confirm downloading AIM-500 candidate images and alpha mattes to a private workflow artifact"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aim500-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ inputs.confirm_download == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out reviewed acquisition tooling
        uses: actions/checkout@v4
        with:
          ref: feat/aim500-local-acquisition
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt

      - name: Install acquisition-only dependencies
        run: python -m pip install -r benchmarks/requirements.txt

      - name: Run selection and safety tests
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v

      - name: Download and extract AIM-500 candidates
        run: python benchmarks/acquire_aim500.py --output benchmarks/results/aim500

      - name: Verify candidate report safety gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("benchmarks/results/aim500/aim500-candidates.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          cases = report.get("cases", [])
          assert len(cases) == 16, f"Expected 16 candidate pairs, got {len(cases)}"
          assert report.get("rights_status") == "pending"
          assert report.get("commercial_use_approved") is False
          for case in cases:
              assert case.get("rights_status") == "pending", case.get("case_id")
              assert case.get("annotation_type") == "alpha", case.get("case_id")
              image = Path("benchmarks/results/aim500/images") / case["filename"]
              matte = Path("benchmarks/results/aim500/masks") / case["annotation_filename"]
              assert image.is_file(), image
              assert matte.is_file(), matte
          print("Verified 16 image/matte pairs. Rights remain pending; commercial use is not approved.")
          PY

      - name: Upload private candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: aim500-candidates-${{ github.run_id }}
          path: benchmarks/results/aim500/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
